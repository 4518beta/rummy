<style>
/* Concepto: batalla de Undertale en una mesa de casino, con paisajes pixelados de Mendoza de fondo. Pantalla única sin scroll en la mesa. */
:root{--cwb:clamp(34px,min(11.4vw,8.4vh),62px);--y:#ffff00;--o:#ff8a00;--malbec:#8C2F4B;--durazno:#F2B59B;--vino:#3B1226;--ps:'Press Start 2P','Courier New',monospace;--vt:'VT323','Courier New',monospace;--cut:polygon(var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)),0 var(--n),var(--n) var(--n));--heart:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'><path fill='%23ff0000' d='M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z'/></svg>");color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;background:#000}
body{margin:0;color:#fff;font:21px/1.15 var(--vt);-webkit-font-smoothing:none}
html.inmesa body{overflow:hidden}
button{font-family:inherit}
.w{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#mesa[hidden],#panel[hidden]{display:none}
html.inmesa,html.inmesa body{height:100%}
/* cajas y botones */
.box{--n:4px;background:#000;border:4px solid #fff;padding:12px 14px;margin:14px 0 0;clip-path:var(--cut)}
.box h2{margin:0 0 8px;font:400 13px/1.5 var(--ps);color:var(--y)}
.box h3{margin:12px 0 6px;font:400 10px/1.4 var(--ps);color:var(--durazno)}
.box p{margin:4px 0 8px}
.dim{color:#a8a8a8}
.ub{--n:4px;position:relative;font:400 21px/1 var(--vt);text-transform:uppercase;background:#000;color:var(--o);border:4px solid var(--o);padding:2px 18px;min-height:44px;cursor:pointer;clip-path:var(--cut);transition:color .1s,border-color .1s}
.ub:hover,.ub:focus-visible{color:var(--y);border-color:var(--y);outline:none}
.ub:hover::before,.ub:focus-visible::before{content:'';position:absolute;left:4px;top:50%;width:14px;height:12px;margin-top:-6px;background:var(--heart) center/contain no-repeat;image-rendering:pixelated}
.ub:active{transform:translateY(2px)}
.ub.p{background:var(--o);color:#000}
.ub.p:hover,.ub.p:focus-visible{background:var(--y);color:#000}
.ub.sm{min-height:36px;font-size:19px;padding:0 10px}
.ub.ready{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:var(--y);color:var(--y)}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text]{height:44px;border:4px solid #fff;background:#000;color:#fff;padding:0 10px;font:400 21px var(--vt);flex:1;min-width:0;border-radius:0}
input[type=text]:focus{outline:none;border-color:var(--y)}
.warn{--n:4px;border:4px solid var(--o);padding:8px 12px;margin:14px 0 0;color:var(--o);clip-path:var(--cut)}
.ficha{display:inline-block;background:var(--y);color:#000;font:400 10px/1 var(--ps);padding:4px 6px;border:2px solid #000}
.mb{display:flex;align-items:center;gap:6px;border:3px solid #fff;padding:2px 10px 2px 4px;--n:3px;clip-path:var(--cut)}
.mb span{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spr{width:34px;height:38px;flex:none;image-rendering:pixelated}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sel .ub{padding:0 6px;white-space:nowrap}.sel .ub::before{display:none!important}.sel+p{margin-top:12px}.sel .ub.on{background:var(--o);color:#000}
.tb{width:100%;border-collapse:collapse}
.tb th{font:400 9px/1.4 var(--ps);color:var(--durazno);text-align:right;padding:4px 4px;border-bottom:3px solid #fff}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:5px 4px;text-align:right;border-bottom:2px solid #444;font-variant-numeric:tabular-nums}
.tb td:first-child{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* banner del panel */
.ban{position:relative;height:150px;overflow:hidden;background:#1b0f3a;border-bottom:4px solid #fff}
.ban canvas{position:absolute;left:0;top:0}
.ban .w{position:relative;height:100%;display:flex;justify-content:space-between;align-items:flex-start;padding-top:14px;gap:10px}
.ban h1{margin:0;font:400 28px/1 var(--ps);color:var(--y);text-shadow:4px 4px 0 #000}
.ban p{margin:10px 0 0;text-shadow:2px 2px 0 #000;font-size:22px}
.nav{display:flex;gap:8px;padding-top:14px}.nav .ub{flex:1}.nav .ub.on{background:var(--o);color:#000}
.dot{display:inline-block;width:10px;height:10px;background:var(--y);animation:blink 1s steps(2) infinite;margin-left:6px}
/* mesa */
#mesa{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;background:#000}

<script>/* Capa de conexion: reemplaza la base de datos de claude.ai por un servidor propio (server/server.js) por WebSocket. */
(function(){
var LS=window.localStorage,store={get:function(k){try{return LS.getItem(k)}catch(e){return null}},set:function(k,v){try{LS.setItem(k,v)}catch(e){}}};
var isApp=!!(window.Capacitor)||location.protocol==='file:'||location.hostname==='localhost'&&!location.port;
var myId=store.get('rummy_id');if(!myId){myId='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);store.set('rummy_id',myId)}
var secure=location.protocol==='https:'||store.get('rummy_secure')==='1';
var cfg={name:store.get('rummy_name')||'',host:store.get('rummy_host')||(isApp?'':location.host)};
var ws=null,open=false,queue=[],subs={},colls={},reqs={},rid=0,offline=false,ready,resolveReady,rejectReady;
ready=new Promise(function(a,b){resolveReady=a;rejectReady=b});
function send(m){var s=JSON.stringify(m);if(open)ws.send(s);else queue.push(s)}
function connect(){
 try{ws=new WebSocket((secure?'wss://':'ws://')+cfg.host)}catch(e){retry();return}
 ws.onopen=function(){open=true;send({t:'hello',id:myId,name:cfg.name});Object.keys(subs).forEach(function(p){send({t:'sub',path:p})});Object.keys(colls).forEach(function(c){send({t:'subc',coll:c})});queue.splice(0).forEach(function(s){ws.send(s)});setDot(1)};
 ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.t==='doc'&&subs[m.path])subs[m.path].forEach(function(cb){cb({exists:m.data!=null,data:function(){return m.data}})});
  else if(m.t==='coll'&&colls[m.coll])colls[m.coll].forEach(function(cb){cb({docs:m.docs.map(function(d){return{data:function(){return d}}})})});
  else if(m.t==='profiles'&&reqs[m.rid]){reqs[m.rid](m.profiles);delete reqs[m.rid]}};
 ws.onclose=function(){open=false;setDot(0);retry()};
 ws.onerror=function(){try{ws.close()}catch(e){}};
}
var rt=0;function retry(){if(offline)return;clearTimeout(rt);rt=setTimeout(connect,2000)}
function setDot(on){var d=document.getElementById('rdot');if(d)d.style.background=on?'#4cff8a':'#ff4a4a'}
function docRef(path){return{
 set:function(d){send({t:'set',path:path,data:d});return Promise.resolve()},
 update:function(d){send({t:'upd',path:path,data:d});return Promise.resolve()},
 delete:function(){send({t:'del',path:path});return Promise.resolve()},
 onSnapshot:function(cb){(subs[path]=subs[path]||[]).push(cb);send({t:'sub',path:path});return function(){}}}}
var DBO={doc:docRef,collection:function(c){return{
 doc:function(id){return docRef(c+'/'+id)},
 orderBy:function(){return this},limit:function(){return this},
 onSnapshot:function(cb){(colls[c]=colls[c]||[]).push(cb);send({t:'subc',coll:c});return function(){}}}}};
var USERO={me:function(){return Promise.resolve({id:myId,name:cfg.name||'Vos',avatarUrl:''})},can:function(){return Promise.resolve(true)},
 profiles:function(ids){return new Promise(function(res){var r=++rid;reqs[r]=res;send({t:'profiles',ids:ids,rid:r})})}};
window.claude={use:function(n){return ready.then(function(){return n==='user'?USERO:DBO})}};
/* pantalla de conexion */
function ask(){
 var o=document.createElement('div');
 o.style.cssText='position:fixed;inset:0;z-index:99;background:#1d0b36;display:flex;align-items:center;justify-content:center;padding:16px;font:22px/1.2 VT323,monospace;color:#fff';
 o.innerHTML='<div style="max-width:360px;width:100%;border:4px solid #fff;background:#000;padding:16px;display:flex;flex-direction:column;gap:10px"><div style="font:400 14px/1.4 \'Press Start 2P\',monospace;color:#ffff00">RUMMY</div><label>Tu nombre<input id="rn" type="text" maxlength="20" style="width:100%;height:44px;margin-top:4px;border:4px solid #fff;background:#000;color:#fff;font:22px VT323,monospace;padding:0 10px"></label>'+(isApp?'<label>Servidor (IP:3000 o https://...)<input id="rh" type="text" inputmode="url" placeholder="192.168.1.20:3000" style="width:100%;height:44px;margin-top:4px;border:4px solid #fff;background:#000;color:#fff;font:22px VT323,monospace;padding:0 10px"></label>':'')+'<button id="rgo" style="min-height:48px;background:#ff8a00;color:#000;border:4px solid #ff8a00;font:24px VT323,monospace;text-transform:uppercase;cursor:pointer">Entrar a la mesa</button><button id="rno" style="min-height:40px;background:#000;color:#fff;border:4px solid #777;font:20px VT323,monospace;text-transform:uppercase;cursor:pointer">Jugar sin conexión</button><div style="color:#a8a8a8;font-size:19px">Todos tienen que estar en el mismo WiFi que la compu que corre el servidor.</div></div>';
 document.body.appendChild(o);
 var n=o.querySelector('#rn'),h=o.querySelector('#rh');n.value=cfg.name;if(h)h.value=cfg.host;
 o.querySelector('#rgo').onclick=function(){var nm=(n.value||'').trim()||'Jugador';var raw=h?(h.value||'').trim():cfg.host;if(h){secure=/^(https|wss):/.test(raw);store.set('rummy_secure',secure?'1':'0')}var ho=raw.replace(/^(https?|wss?):\/\//,'').replace(/\/+$/,'');if(!ho){h&&h.focus();return}
  cfg.name=nm;cfg.host=ho.indexOf(':')<0&&isApp&&!secure?ho+':3000':ho;store.set('rummy_name',nm);store.set('rummy_host',cfg.host);o.remove();connect();resolveReady()};
 o.querySelector('#rno').onclick=function(){offline=true;o.remove();rejectReady(new Error('offline'))};
}
function badge(){var d=document.createElement('div');d.id='rdot';d.style.cssText='position:fixed;right:max(6px,env(safe-area-inset-right,0px));top:max(6px,env(safe-area-inset-top,0px));width:10px;height:10px;border:2px solid #000;background:#ff4a4a;z-index:50;pointer-events:none';document.body.appendChild(d)}
function start(){badge();ask()}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();

 var n=cards.length;if(n<3||n>14)return null;
 var best=null;
 var seen={};cards.forEach(function(c){if(!c.joker)seen[c.rank]=1});
 Object.keys(seen).forEach(function(k){
  var r=+k,nat=[],mon=[],bad=false;
  cards.forEach(function(c){if(c.joker)mon.push(c);else if(c.rank===r)nat.push(c);else if(c.rank===2)mon.push(c);else bad=true});
  if(bad||nat.length<2||mon.length>nat.length||n>4)return;
  var ss={},dup=false;nat.forEach(function(c){if(ss[c.suit])dup=true;ss[c.suit]=1});if(dup)return;
  var v=0;nat.forEach(function(c){v+=cv(c)});mon.forEach(function(c){v+=c.joker?50:((r===1||r>=8)?20:5)});
  if(!best||v>best.v)best={k:'set',v:v,o:nat.concat(mon),l:'Pierna de '+RL[r]};
 });
 for(var s=0;s<4;s++){
  var su=[],mb=[],bad=false;
  cards.forEach(function(c){if(c.joker)mb.push(c);else if(c.suit===s)su.push(c);else if(c.rank===2)mb.push(c);else bad=true});
  if(bad||su.length<2)continue;
  var tw=su.filter(function(c){return c.rank===2});
  for(var m=0;m<(1<<tw.length);m++){
   var nat=[],mon=mb.slice();
   su.forEach(function(c){var ti=tw.indexOf(c);if(ti>=0&&((m>>ti)&1))mon.push(c);else nat.push(c)});
   if(nat.length<2||mon.length>nat.length)continue;
   var aces=nat.filter(function(c){return c.rank===1}).length;if(aces>1)continue;
   var modes=aces?[1,14]:[0];
   for(var mi=0;mi<modes.length;mi++){
    var am=modes[mi];
    var idx=nat.map(function(c){return c.rank===1?am:c.rank});
    var mark={},dup2=false;idx.forEach(function(x){if(mark[x])dup2=true;mark[x]=1});if(dup2)continue;
    var mn=Math.min.apply(null,idx),mx=Math.max.apply(null,idx);
    for(var st=Math.max(1,mx-n+1);st<=Math.min(mn,15-n);st++){
     var empty=[];for(var q=st;q<st+n;q++)if(!mark[q])empty.push(q);
     var twoM=mon.filter(function(c){return !c.joker}),jk=mon.filter(function(c){return c.joker});
     var order=empty.slice().sort(function(a,b){return slotVal(b)-slotVal(a)||a-b});
     var v=0;nat.forEach(function(c){v+=cv(c)});v+=jk.length*50;
     var pool=twoM.concat(jk),assign={};
     order.forEach(function(sl,ix){assign[sl]=pool[ix];if(ix<twoM.length)v+=slotVal(sl)});
     var o=[];for(var q2=st;q2<st+n;q2++){if(mark[q2])o.push(nat[idx.indexOf(q2)]);else o.push(assign[q2])}
     if(!best||v>best.v)best={k:'run',v:v,o:o,l:'Escalera de '+SU[s]};
    }
   }
  }
 }

}
function quick(cs){var nm=cs.filter(function(c){return !isMono(c)});if(nm.length<2)return true;var r=nm[0].rank,s=nm[0].suit,sr=true,ss=true;for(var i=1;i<nm.length;i++){if(nm[i].rank!==r)sr=false;if(nm[i].suit!==s)ss=false}return sr||ss}
function pop(x){var n=0;while(x){x&=x-1;n++}return n}
function ctz(x){return 31-Math.clz32(x&-x)}
function solve(cards,strict){
 var n=cards.length,iso=[],cand=cards;
 if(n>16){
  cand=[];
  cards.forEach(function(c,i){
   var ok=false;
   for(var a=0;a<n&&!ok;a++){if(a===i)continue;for(var b=a+1;b<n;b++){if(b===i)continue;var t=[c,cards[a],cards[b]];if(quick(t)&&validate(t)){ok=true;break}}}
   if(ok)cand.push(c);else iso.push(c);
  });
  if(cand.length>16){iso=iso.concat(cand.slice(16));cand=cand.slice(0,16)}
 }
 var m=cand.length,byLow=[],tot=1<<m,i;
 for(i=0;i<m;i++)byLow.push([]);
 for(var mask=1;mask<tot;mask++){
  var pc=pop(mask);if(pc<3||pc>14)continue;
  var cs=[];for(var b2=0;b2<m;b2++)if(mask&(1<<b2))cs.push(cand[b2]);
  if(!quick(cs))continue;
  var v=validate(cs);if(v)byLow[ctz(mask)].push({mask:mask,v:v});
 }
 var memo={};
 function f(mask){
  if(mask===0)return{cost:0,melds:[],left:[]};
  if(memo[mask])return memo[mask];
  var low=ctz(mask),c=cand[low];
  var sub=f(mask&~(1<<low));
  var res={cost:sub.cost+((strict&&isMono(c))?1000:1),melds:sub.melds,left:sub.left.concat([c])};
  var L=byLow[low];
  for(var j=0;j<L.length;j++){var o=L[j];if((o.mask&mask)===o.mask){var s2=f(mask&~o.mask);if(s2.cost<res.cost)res={cost:s2.cost,melds:s2.melds.concat([o.v]),left:s2.left}}}
  memo[mask]=res;return res;
 }
 var r=f(tot-1),cost=r.cost;
 iso.forEach(function(c){cost+=(strict&&isMono(c))?1000:1});
 return{melds:r.melds,left:r.left.concat(iso),cost:cost};
}
function meldRec(v){return{c:v.o.map(function(x){return x.id}),v:v.v,k:v.k,l:v.l}}
function meldKeep(v,old){var m=meldRec(v);if(old&&old.a)m.a=old.a.slice();return m}
function sum(a,f){var s=0;a.forEach(function(x){s+=f(x)});return s}
function randInt(n){
 var g=(typeof crypto!=='undefined'&&crypto.getRandomValues)?crypto:null;
 if(!g)return Math.floor(Math.random()*n);
 var lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);
 do{g.getRandomValues(a)}while(a[0]>=lim);

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=randInt(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

function deal(g){
 g.rd++;var ids=[];for(var i=0;i<52;i++)ids.push(i);ids.push(104,105);shuffle(ids);
 g.h=g.players.map(function(){return[]});g.t=g.players.map(function(){return[]});
 for(var r=0;r<11;r++)g.players.forEach(function(p,k){g.h[k].push(ids.pop())});
 g.pozo=[ids.pop()];g.deck=ids;g.cur=(g.rd-1)%g.players.length;g.ph='draw';g.res=null;
 g.players.forEach(function(p){p.ts=0});
}
function doDraw(g,k,src){
 var h=g.h[k];
 if(src==='deck'&&!g.deck.length){
  if(g.pozo.length>1){var top=g.pozo.pop();g.deck=shuffle(g.pozo);g.pozo=[top]}else src='pozo';
 }
 if(src==='pozo'){var n=g.pozo.length;Array.prototype.push.apply(h,g.pozo);g.pozo=[];g.ph='play';return n}
 h.push(g.deck.pop());g.ph='play';return 0;
}
function planCut(g,k){
 for(var mode=0;mode<3;mode++){
  var hand=g.h[k].map(C),table=g.t[k].map(function(m){var q={c:m.c.slice(),v:m.v,k:m.k,l:m.l};if(m.a)q.a=m.a.slice();return q});
  if(mode<2){
   var ch=true;
   while(ch&&hand.length){
    ch=false;
    outer:for(var i=0;i<hand.length;i++){
     if(mode===0&&isMono(hand[i]))continue;
     for(var j=0;j<table.length;j++){
      var v=validate(table[j].c.map(C).concat([hand[i]]));
      if(v){table[j]=meldKeep(v,table[j]);hand.splice(i,1);ch=true;break outer}
     }
    }
   }
  }
  var part=hand.length?solve(hand,true):{melds:[],left:[],cost:0};
  if(part.cost<=1)return{table:table,melds:part.melds.map(meldRec),left:part.left};
 }
 return null;
}
function endRound(g,w,kind){
 var ex=g.players.map(function(){return 0});
 g.t.forEach(function(ms,o){ms.forEach(function(m){(m.a||[]).forEach(function(x){ex[x[0]]+=x[1];ex[o]-=x[1]})})});

  var laid=sum(g.t[k],function(m){return m.v})+ex[k];
  var hand=k===w?0:sum(g.h[k],function(id){return cv(C(id))});
  var bonus=k===w?(kind==='arriba'?100:25):0;
  var tot=laid-hand+bonus;p.s+=tot;
  return{laid:laid,hand:hand,bonus:bonus,tot:tot};
 });
 g.res={w:w,kind:kind,rows:rows};g.ph='round';
 var best=-1e9,bi=0;g.players.forEach(function(p,k){if(p.s>best){best=p.s;bi=k}});

function applyCut(g,k,plan){

 for(j=0;j<H;j++){var ins=(j<2||j>H-3)?2:(j<4||j>H-5)?1:0;RC(x,'#8a5a2c',bx+ins,by+j,W-ins*2,1)}
 for(i=3;i<W-2;i+=4)RC(x,'#a8743c',bx+i,by+2,1,H-4);
 RC(x,'#3b1a0c',bx+1,by+3,W-2,2);RC(x,'#3b1a0c',bx+1,by+H-5,W-2,2);RC(x,'#d8b24a',bx+1,by+3,W-2,1);
 RC(x,'#240c06',bx+2,by,W-4,1);RC(x,'#240c06',bx+2,by+H-1,W-4,1);
 RC(x,'#240c06',bx,by+4,1,H-8);RC(x,'#240c06',bx+W-1,by+4,1,H-8);
 RC(x,'#d8b24a',bx+W/2-1,by+H-4,3,2);
}
function copa(x,cx,by){
 var r;
 for(r=0;r<9;r++){var wd=r<3?5-Math.floor(r/3):r<6?5-Math.floor((r-1)/2):2;wd=Math.max(2,5-Math.floor(r*.45));RC(x,'#e8f4ff',cx-wd,by+r,wd*2+1,1);if(r>=3)RC(x,'#8C2F4B',cx-wd+1,by+r,wd*2-1,1)}
 PX(x,'#fff',cx-3,by+1);PX(x,'#fff',cx-3,by+2);
 RC(x,'#e8f4ff',cx,by+9,1,6);RC(x,'#e8f4ff',cx-3,by+15,7,1);RC(x,'#9bb0c4',cx-3,by+16,7,1);
}
function fgVine(x,w,h,side,r){
 var base=side?w-1:0,dir=side?-1:1,top=Math.floor(h*.62),i,j;
 for(j=top;j<h;j++){var sw=Math.round(Math.sin(j*.18)*1.5);RC(x,'#5a3f26',base+dir*(3+sw),j,2,1);if(j%7===0){leaf(x,base+dir*(5+sw)-(side?3:0),j,side);leaf(x,base+dir*(1+sw)-(side?3:0),j+2,!side)}}
 cluster(x,base+dir*9,top+8,3);cluster(x,base+dir*4,top+26,4);
}
var menuKey='';
function paintMenu(){
 var b=$('#menc');if(!b||!b.getContext)return;
 var W=innerWidth,H=innerHeight,key=W+'x'+H;if(!W||!H||key===menuKey)return;
 var s=Math.max(3,Math.round(H/150)),w=Math.ceil(W/s),h=Math.ceil(H/s),x,r=mulberry(77);
 try{b.width=w;b.height=h;x=b.getContext('2d')}catch(e){x=null}
 if(!x)return;menuKey=key;
 b.style.width=w*s+'px';b.style.height=h*s+'px';
 drawScene(x,w,h,0);
 vineTop(x,w,h,r);
 fgVine(x,w,h,0,r);fgVine(x,w,h,1,r);
 var gy=h-4;
 barrel(x,Math.floor(w*.14),gy-15);
 copa(x,Math.floor(w*.84),gy-17);
}

async function init(){
 paintBanner();
 var rt=0;window.addEventListener('resize',function(){cancelAnimationFrame(rt);rt=requestAnimationFrame(function(){bgKey='';paintBanner();if(view==='mesa')paintBg();if(view==='menu')paintMenu()})});
 render();
 var cl=window.claude;
 if(cl&&cl.use){
  try{USER=await cl.use('user')}catch(e){}
  if(USER){try{ME=await USER.me();MYID=ME.id;if(MYID)names[MYID]=ME.name||'Vos';avs[MYID]=ME.avatarUrl;var cw=await USER.can('data.write');CANW=cw!==false}catch(e){}}
  try{DB=await cl.use('db')}catch(e){}
 }
 if(DB&&MYID){
  groupRef=DB.doc('family/group');tableRef=DB.doc('family/table');histRef=DB.collection('history');
  groupRef.onSnapshot(function(s){GROUP=s.exists?s.data():null;render()},function(){});
  tableRef.onSnapshot(function(s){
   if(!s.exists){OG=null;if(MODE==='online'){G=null}render();return}
   var d=s.data();if(!d||!d.state)return;
   if(recent.indexOf(d.state)>=0)return;
   var g;try{g=JSON.parse(d.state)}catch(e){return}
   if(OG&&g.id===OG.id&&g.v<OG.v)return;
   OG=g;if(MODE==='online'){G=g}
   render();checkBot();
  },function(){});
  histRef.orderBy('at','desc').limit(60).onSnapshot(function(q){HIST=q.docs.map(function(d){return d.data()});render()},function(){});
 }
 render();
}
init();
})();
